<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>南极环线单词本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Charis+SIL:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* Layout: 一条从北纬到南极的纬度轨道（章节）+ 下方单列学习区。色彩取自行程单的纬度带：金=热带，石青=中纬，冰蓝=极地 */
:root{
  --bg:#EEF2F3; --surface:#FFFFFF; --sunk:#E3EAEC; --ink:#10212E; --muted:#58697A; --line:#D3DDE1;
  --ice:#1F6F99; --ice-soft:#DCEEF6; --gold:#A77A1E; --gold-soft:#F5EBD4; --slate:#4B6476; --polar:#3B9CC9;
  --good:#2C7A52; --good-soft:#DDF0E5; --bad:#B4483A; --bad-soft:#F6E1DD;
  --f-word:"Charis SIL", "Charis", Georgia, "Times New Roman", serif;
  --f-zh:"Noto Serif SC", "Songti SC", "STSong", serif;
  --f-body:-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A141C; --surface:#111F2A; --sunk:#0D1922; --ink:#E4EDF2; --muted:#93A7B5; --line:#223543;
  --ice:#7CC3E6; --ice-soft:#16303F; --gold:#E2B65C; --gold-soft:#2E2715; --slate:#9DB4C4; --polar:#8DD3F2;
  --good:#6CC797; --good-soft:#14301F; --bad:#EE8B7C; --bad-soft:#3A1E1A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0A141C; --surface:#111F2A; --sunk:#0D1922; --ink:#E4EDF2; --muted:#93A7B5; --line:#223543;
  --ice:#7CC3E6; --ice-soft:#16303F; --gold:#E2B65C; --gold-soft:#2E2715; --slate:#9DB4C4; --polar:#8DD3F2;
  --good:#6CC797; --good-soft:#14301F; --bad:#EE8B7C; --bad-soft:#3A1E1A; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 头部 */
header.top{padding-block:22px 6px}
.route{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em;display:flex;flex-wrap:wrap;gap:4px 10px}
.route b{color:var(--ice);font-weight:500}
h1{font-family:var(--f-zh);font-weight:900;font-size:clamp(28px,6vw,40px);line-height:1.15;margin:8px 0 4px;letter-spacing:.02em;text-wrap:balance}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:10px}
.today{font-size:14px}
.today strong{font-family:var(--f-zh);font-weight:600}
.meter{flex:1;min-width:180px;display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.bar{flex:1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:3px;transition:width .3s}
.sync{font-size:12px;color:var(--muted)}

/* 纬度轨道 */
.rail-wrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;border-bottom:1px solid var(--line)}
.rail{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px;scroll-snap-type:x proximity}
.chip{flex:none;scroll-snap-align:start;position:relative;display:grid;gap:1px;text-align:left;min-width:118px;padding:8px 12px 8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.chip::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 3px 3px 0;background:var(--band,var(--muted))}
.chip[data-band="trop"]{--band:var(--gold)} .chip[data-band="mid"]{--band:var(--slate)} .chip[data-band="polar"]{--band:var(--polar)} .chip[data-band="all"]{--band:var(--line)}
.chip .n{font-weight:600;font-size:14px;white-space:nowrap}
.chip .d{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.chip .p{font-family:var(--f-mono);font-size:11px;color:var(--good)}
.chip[aria-pressed="true"]{border-color:var(--ice);background:var(--ice-soft)}
.chip .badge{position:absolute;top:-7px;right:8px;font-size:10px;font-weight:600;padding:1px 6px;border-radius:6px;background:var(--gold);color:var(--surface)}
.tabs{display:flex;gap:4px;margin-top:10px;background:var(--sunk);border-radius:10px;padding:3px;width:max-content;max-width:100%}
.tabs button{border:0;background:transparent;padding:6px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

main{padding-block:16px 60px}
.ch-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-bottom:12px}
.ch-head h2{font-family:var(--f-zh);font-weight:600;font-size:22px;margin:0}
.ch-head .en{font-family:var(--f-word);font-style:italic;color:var(--muted);font-size:16px}
.ch-head .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-left:auto}

/* 工具条 */
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.search{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font:inherit;color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* 单词卡 */
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:820px){.grid{grid-template-columns:1fr 1fr}}
.card{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 12px;display:grid;gap:6px;align-content:start}
.card.done{background:color-mix(in srgb,var(--surface) 70%,var(--good-soft))}
.w-row{display:flex;align-items:flex-start;gap:8px}
.word{font-family:var(--f-word);font-weight:700;font-size:22px;line-height:1.2;overflow-wrap:anywhere}
.tag{flex:none;margin-top:4px;font-size:11px;padding:1px 7px;border-radius:6px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.loc{background:var(--gold-soft);color:var(--gold)}
.mark{margin-left:auto;flex:none;border:1px solid var(--line);background:transparent;border-radius:8px;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--muted);white-space:nowrap}
.mark[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.ipa-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ipa{font-family:var(--f-word);font-size:17px;color:var(--ice)}
.say{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ice);padding:0}
.say svg{width:15px;height:15px}
.say.slow{width:auto;border-radius:15px;padding:0 9px;font-size:12px;font-weight:600}
.zh{font-size:16px;font-weight:600}
.ex{font-family:var(--f-word);font-size:16px;line-height:1.45;display:flex;gap:6px;align-items:flex-start}
.ex mark{background:var(--ice-soft);color:inherit;border-radius:3px;padding:0 2px}
.ex .say{width:26px;height:26px;flex:none;margin-top:1px}
.exzh{color:var(--muted);font-size:14px}
.tip{font-size:13px;color:var(--ink);background:var(--gold-soft);border-radius:8px;padding:6px 10px}
.tip b{color:var(--gold);margin-right:6px;font-weight:600}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

/* 闪卡 */
.stage{max-width:560px;margin:0 auto;display:grid;gap:14px}
.opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.flash{min-height:300px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 22px;display:grid;place-items:center;text-align:center;cursor:pointer;position:relative;user-select:none}
.flash .count{position:absolute;top:12px;left:16px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.flash .hint{position:absolute;bottom:12px;left:0;right:0;font-size:12px;color:var(--muted)}
.flash .big{font-family:var(--f-word);font-weight:700;font-size:clamp(28px,7vw,40px);line-height:1.15;overflow-wrap:anywhere}
.flash .bigzh{font-family:var(--f-zh);font-weight:600;font-size:clamp(24px,6vw,32px)}
.flash .inner{display:grid;gap:10px;justify-items:center;max-width:100%}
.flash .ex{justify-content:center;text-align:left}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px;font-weight:600;font-size:15px;cursor:pointer}
.btn.no{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.yes{background:var(--good);border-color:var(--good);color:var(--surface)}
.btn.primary{background:var(--ice);border-color:var(--ice);color:var(--surface)}
.kbd{font-size:12px;color:var(--muted);text-align:center}

/* 测验 */
.q{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 20px;display:grid;gap:12px;text-align:center;justify-items:center}
.q .count{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.choices{display:grid;gap:8px}
.choice{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:15px;cursor:pointer}
.choice.right{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.choice.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.choice:disabled{cursor:default}
.feedback{background:var(--sunk);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.result{text-align:center;display:grid;gap:8px;justify-items:center}
.result .score{font-family:var(--f-word);font-weight:700;font-size:56px;line-height:1}
.missed{width:100%;text-align:left;display:grid;gap:6px}
.missed div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.missed .word{font-size:17px}
footer{font-size:12px;color:var(--muted);padding-block:0 30px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

<script>
(function(){
const TRIP_START="2026-10-21", TRIP_END="2026-11-21";
const LANG={"n:es":["es-ES","西语"],"n:pt":["pt-BR","葡语"],"n:fr":["fr-FR","法语"]};
const SAY={"9/11 Memorial":"nine eleven Memorial","76ers":"seventy-sixers","30th Street Station":"thirtieth Street Station","OMNY":"omni","IAATO":"eye ah toe","MoMA":"moma","PIN":"pin","WEGO":"we go","Warner Bros. Studio Tour":"Warner Brothers Studio Tour","MEP rate":"M E P rate","ATM fee":"A T M fee","TCL Chinese Theatre":"T C L Chinese Theatre","UP Express":"U P Express","SEPTA":"septa","NJ Transit":"N J Transit","HX Hurtigruten Expeditions":"H X Hurtigruten Expeditions","MS Fridtjof Nansen":"M S Fritt-yof Nansen","Tom Bradley International Terminal":"Tom Bradley International Terminal"};

/* ---------- 数据 ---------- */
const ALL=[];
CHAPTERS.forEach(c=>{c.items=c.words.map(a=>{const it={id:c.id+"|"+a[0],ch:c,w:a[0],ipa:a[1],zh:a[2],ex:a[3],exZh:a[4],tip:a[5]||"",kind:a[6]||""};ALL.push(it);return it;});});
const BYID=Object.fromEntries(ALL.map(x=>[x.id,x]));

/* ---------- 状态 ---------- */
const store={get(k,d){try{const v=localStorage.getItem("aw:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("aw:"+k,JSON.stringify(v))}catch(e){}}};
let prog=store.get("prog",{m:{},t:0});            // m: 已记住的词 id
const ui=Object.assign({ch:null,mode:"list",filter:"all",q:"",dir:"en",auto:true,quizAudio:false},store.get("ui",{}));
ui.q="";
const isDone=id=>!!prog.m[id];
function setDone(id,v){if(v)prog.m[id]=1;else delete prog.m[id];prog.t=Date.now();store.set("prog",prog);queueRemote();renderMeter();renderRail();}
function saveUI(){store.set("ui",{ch:ui.ch,mode:ui.mode,filter:ui.filter,dir:ui.dir,auto:ui.auto,quizAudio:ui.quizAudio});}

/* ---------- 跨设备同步（Claude 账户） ---------- */
let remote=null,remoteTimer=null;
const syncEl=document.getElementById("sync");
function queueRemote(){if(!remote)return;clearTimeout(remoteTimer);remoteTimer=setTimeout(async()=>{try{await remote.set({m:Object.keys(prog.m),t:prog.t});syncEl.textContent="已同步到你的账户";}catch(e){syncEl.textContent="同步暂时失败，进度已存在本机";}},1200);}
async function initRemote(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [user,db]=await Promise.all([window.claude.use("user"),window.claude.use("db")]);
    if(!user||!db)return;
    const uid=await user.id(); if(!uid)return;
    remote=db.doc("data/users/"+uid+"/progress");
    const snap=await remote.get();
    const d=snap.exists?snap.data():null;
    if(d&&Array.isArray(d.m)&&(d.t||0)>(prog.t||0)){prog={m:Object.fromEntries(d.m.filter(id=>BYID[id]).map(id=>[id,1])),t:d.t};store.set("prog",prog);renderAll();}
    else if(prog.t&&(!d||(d.t||0)<prog.t)){queueRemote();}
    syncEl.textContent="进度跟随你的 Claude 账户，手机电脑通用";
  }catch(e){syncEl.textContent="";}
}

/* ---------- 发音 ---------- */
const canSpeak="speechSynthesis" in window;
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){}}
if(canSpeak){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices}catch(e){}}
function pickVoice(lang){
  const norm=v=>v.lang.replace("_","-");
  const exact=voices.filter(v=>norm(v)===lang);
  const pref=exact.find(v=>/Samantha|Google US|Ava|Allison|Luciana|Monica|Paulina|Thomas|Amélie/i.test(v.name));
  return pref||exact[0]||voices.find(v=>norm(v).startsWith(lang.slice(0,2)));
}
function speak(text,lang,rate){
  if(!canSpeak)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang||"en-US"; u.rate=rate||0.92;
    const v=pickVoice(u.lang); if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
const langOf=it=>(LANG[it.kind]||["en-US"])[0];
const sayWord=(it,slow)=>speak(SAY[it.w]||it.w,langOf(it),slow?0.55:0.9);
const sayEx=it=>speak(it.ex,"en-US",0.9);
const ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

/* ---------- 工具 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function highlight(ex,w){
  const base=w.replace(/\s*\(.*?\)/g,"").replace(/^(the|a|an)\s+/i,"");
  const parts=base.split(/[\s-]+/).filter(Boolean).map(p=>{let s=p.replace(/[.']/g,"");if(s.length>5)s=s.slice(0,-2);return s.replace(/[.*+?^${}()|[\]\\\/]/g,"\\$&")+"[\\w'’.]*";});
  const safe=esc(ex);
  if(!parts.length)return safe;
  try{const re=new RegExp("("+parts.join("[\\s-]+")+")","i");return safe.replace(re,"<mark>$1</mark>");}catch(e){return safe;}
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const TODAY=ymd(new Date());
const dayDiff=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5);
function ranges(c){if(!c.range)return[];return Array.isArray(c.range[0])?c.range:[c.range];}
const isToday=c=>ranges(c).some(([s,e])=>TODAY>=s&&TODAY<=e);
function nextStop(){let best=null;CHAPTERS.forEach(c=>ranges(c).forEach(([s])=>{if(s>TODAY&&(!best||s<best.s))best={c,s};}));return best;}
const scopeItems=()=>ui.ch==="all"?ALL:(CHAPTERS.find(c=>c.id===ui.ch)||CHAPTERS[0]).items;

/* ---------- 头部 ---------- */
function renderToday(){
  const el=$("#today"); const tc=CHAPTERS.filter(c=>c.range&&isToday(c)); const ns=nextStop();
  if(TODAY<TRIP_START){const n=dayDiff(TODAY,TRIP_START);el.innerHTML="<strong>距出发还有 "+n+" 天</strong> · 10/21 香港 → 仁川，先背「机场与航班」";}
  else if(TODAY>TRIP_END){el.innerHTML="<strong>旅程已结束</strong> · 32 天，跨越 108 个纬度";}
  else{const n=dayDiff(TRIP_START,TODAY)+1;el.innerHTML="<strong>第 "+n+" / 32 天</strong> · "+(tc.length?"今天："+tc.map(c=>esc(c.zh)).join("、"):"在路上")+(ns?" · 下一站 "+esc(ns.c.zh)+"（"+ns.s.slice(5).replace("-","/")+"）":"");}
}
function renderMeter(){const n=ALL.filter(x=>isDone(x.id)).length;$("#mcount").textContent="已记住 "+n+" / "+ALL.length;$("#mbar").style.width=(n/ALL.length*100).toFixed(1)+"%";}
function renderRail(){
  const ns=nextStop();
  const chips=[{id:"all",zh:"全部",when:"15 个场景",band:"all",items:ALL}].concat(CHAPTERS);
  $("#rail").innerHTML=chips.map(c=>{
    const done=c.items.filter(x=>isDone(x.id)).length;
    let badge="";
    if(c.range&&isToday(c))badge='<span class="badge">今天</span>';
    else if(ns&&ns.c===c&&TODAY>=TRIP_START)badge='<span class="badge">下一站</span>';
    return '<button class="chip" data-ch="'+c.id+'" data-band="'+c.band+'" aria-pressed="'+(ui.ch===c.id)+'">'+badge+'<span class="n">'+esc(c.zh)+'</span><span class="d">'+esc(c.when)+'</span><span class="p">'+done+" / "+c.items.length+"</span></button>";
  }).join("");
}
$("#rail").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;ui.ch=b.dataset.ch;saveUI();resetSessions();renderRail();renderMain();window.scrollTo({top:0,behavior:"smooth"});});
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-mode]");if(!b)return;ui.mode=b.dataset.mode;saveUI();resetSessions();renderTabs();renderMain();});
function renderTabs(){document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.mode===ui.mode)));}

function chHead(){
  if(ui.ch==="all")return '<div class="ch-head"><h2>全部词汇</h2><span class="en">All 15 scenes</span><span class="meta">'+ALL.length+' 词</span></div>';
  const c=CHAPTERS.find(x=>x.id===ui.ch);
  return '<div class="ch-head"><h2>'+esc(c.zh)+'</h2><span class="en">'+esc(c.en)+'</span><span class="meta">'+esc(c.when)+(c.lat?" · "+esc(c.lat):"")+" · "+c.items.length+" 词</span></div>";
}

/* ---------- 单词表 ---------- */
function cardHTML(it){
  const loc=LANG[it.kind];
  const tag=loc?'<span class="tag loc">'+loc[1]+'</span>':(it.kind?'<span class="tag">专有名词</span>':"");
  const sp=canSpeak?'<button class="say" data-say="w" aria-label="播放发音">'+ICON+'</button><button class="say slow" data-say="slow" aria-label="慢速播放">慢</button>':"";
  return '<article class="card'+(isDone(it.id)?" done":"")+'" data-id="'+esc(it.id)+'">'+
    '<div class="w-row"><span class="word">'+esc(it.w)+'</span>'+tag+'<button class="mark" data-mark aria-pressed="'+isDone(it.id)+'">'+(isDone(it.id)?"已记住":"记住了")+'</button></div>'+
    '<div class="ipa-row"><span class="ipa">'+esc(it.ipa)+'</span>'+sp+'</div>'+
    '<div class="zh">'+esc(it.zh)+'</div>'+
    '<div class="ex">'+(canSpeak?'<button class="say" data-say="ex" aria-label="播放例句">'+ICON+'</button>':"")+'<span>'+highlight(it.ex,it.w)+'</span></div>'+
    '<div class="exzh">'+esc(it.exZh)+'</div>'+
    (it.tip?'<div class="tip"><b>记忆</b>'+esc(it.tip)+'</div>':"")+
  '</article>';
}
function listItems(){
  const q=ui.q.trim().toLowerCase();
  let items=q?ALL:scopeItems();
  if(q)items=items.filter(x=>(x.w+" "+x.zh+" "+x.ex).toLowerCase().includes(q));
  if(ui.filter==="todo")items=items.filter(x=>!isDone(x.id));
  else if(ui.filter==="done")items=items.filter(x=>isDone(x.id));
  else if(ui.filter==="name")items=items.filter(x=>x.kind);
  return items;
}
function renderList(){
  const m=$("#main");
  m.innerHTML=chHead()+
    '<div class="tools"><input class="search" id="search" type="search" placeholder="搜索全部词汇：英文、中文或例句" value="'+esc(ui.q)+'">'+
    '<div class="seg" id="filter">'+[["all","全部"],["todo","没记住"],["done","已记住"],["name","专有名词"]].map(([k,l])=>'<button data-f="'+k+'" aria-pressed="'+(ui.filter===k)+'">'+l+"</button>").join("")+"</div></div>"+
    '<div class="grid" id="grid"></div>';
  fillGrid();
  $("#search").addEventListener("input",e=>{ui.q=e.target.value;fillGrid();});
  $("#filter").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;ui.filter=b.dataset.f;saveUI();document.querySelectorAll("#filter button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));fillGrid();});
}
function fillGrid(){
  const items=listItems();
  $("#grid").innerHTML=items.length?items.map(cardHTML).join(""):'<div class="empty">'+(ui.filter==="todo"?"这一组全部记住了，可以换个场景或做个测验。":"没有找到匹配的词。")+"</div>";
}
document.addEventListener("click",e=>{
  const card=e.target.closest(".card"); if(!card)return;
  const it=BYID[card.dataset.id]; if(!it)return;
  const s=e.target.closest("[data-say]");
  if(s){const k=s.dataset.say;if(k==="ex")sayEx(it);else sayWord(it,k==="slow");return;}
  if(e.target.closest("[data-mark]")){
    const v=!isDone(it.id);setDone(it.id,v);
    card.classList.toggle("done",v);const b=card.querySelector("[data-mark]");b.setAttribute("aria-pressed",String(v));b.textContent=v?"已记住":"记住了";
    if(ui.filter==="todo"&&v){setTimeout(()=>{if(card.isConnected){card.remove();if(!$("#grid").children.length)fillGrid();}},450);}
  }
});

/* ---------- 闪卡 ---------- */
let fs=null;
function newFlash(){const pool=scopeItems().filter(x=>!isDone(x.id));fs={deck:shuffle(pool.length?pool:scopeItems()),i:0,flipped:false,known:0,total:0,allDone:!pool.length};fs.total=fs.deck.length;}
function renderFlash(){
  if(!fs)newFlash();
  const m=$("#main");
  const it=fs.deck[0];
  const opts='<div class="opts"><div class="seg" id="dir"><button data-d="en" aria-pressed="'+(ui.dir==="en")+'">看英文想中文</button><button data-d="zh" aria-pressed="'+(ui.dir==="zh")+'">看中文想英文</button></div>'+
    (canSpeak?'<div class="seg"><button id="auto" aria-pressed="'+ui.auto+'">自动发音</button></div>':"")+"</div>";
  if(!it){
    m.innerHTML=chHead()+'<div class="stage">'+opts+'<div class="flash" style="cursor:default"><div class="inner"><div class="bigzh">这一轮完成</div><div class="exzh">新记住 '+fs.known+" 个词。</div></div></div>"+
      '<button class="btn primary" id="again">再来一轮</button></div>';
    $("#again").onclick=()=>{newFlash();renderFlash();};bindFlashOpts();return;
  }
  const loc=LANG[it.kind];
  const front=ui.dir==="en"
    ?'<div class="big">'+esc(it.w)+'</div><div class="ipa">'+esc(it.ipa)+(loc?" · "+loc[1]:"")+"</div>"
    :'<div class="bigzh">'+esc(it.zh)+'</div><div class="exzh">'+esc(it.exZh)+"</div>";
  const back=ui.dir==="en"
    ?'<div class="bigzh">'+esc(it.zh)+'</div><div class="ex"><span>'+highlight(it.ex,it.w)+'</span></div><div class="exzh">'+esc(it.exZh)+"</div>"
    :'<div class="big">'+esc(it.w)+'</div><div class="ipa">'+esc(it.ipa)+'</div><div class="ex"><span>'+highlight(it.ex,it.w)+"</span></div>";
  m.innerHTML=chHead()+'<div class="stage">'+opts+
    '<div class="flash" id="card" role="button" tabindex="0" aria-label="点击翻面"><span class="count">'+(fs.total-fs.deck.length+1)+" / "+fs.total+(fs.allDone?" · 复习已记住":"")+'</span><div class="inner">'+front+(fs.flipped?'<div style="height:6px"></div>'+back+(it.tip?'<div class="tip"><b>记忆</b>'+esc(it.tip)+"</div>":""):"")+'</div><span class="hint">'+(fs.flipped?"":"点卡片翻面")+"</span></div>"+
    (canSpeak?'<div class="opts"><button class="say" id="fsay" aria-label="播放发音">'+ICON+'</button><button class="say slow" id="fslow">慢</button><button class="say slow" id="fex">例句</button></div>':"")+
    '<div class="actions"><button class="btn no" id="no">还不熟</button><button class="btn yes" id="yes">记住了</button></div>'+
    '<div class="kbd">键盘：空格翻面 · ← 还不熟 · → 记住了</div></div>';
  bindFlashOpts();
  $("#card").onclick=()=>{fs.flipped=!fs.flipped;renderFlash();if(fs.flipped&&ui.dir==="zh"&&ui.auto)sayWord(it);};
  if(canSpeak){$("#fsay").onclick=()=>sayWord(it);$("#fslow").onclick=()=>sayWord(it,true);$("#fex").onclick=()=>sayEx(it);}
  $("#no").onclick=()=>flashAnswer(false);$("#yes").onclick=()=>flashAnswer(true);
  if(!fs.flipped&&ui.dir==="en"&&ui.auto&&!fs.spoke){fs.spoke=true;sayWord(it);}
}
function bindFlashOpts(){
  const d=$("#dir");if(d)d.onclick=e=>{const b=e.target.closest("button");if(!b)return;ui.dir=b.dataset.d;saveUI();fs.flipped=false;fs.spoke=false;renderFlash();};
  const a=$("#auto");if(a)a.onclick=()=>{ui.auto=!ui.auto;saveUI();a.setAttribute("aria-pressed",String(ui.auto));};
}
function flashAnswer(ok){
  const it=fs.deck.shift(); if(!it)return;
  if(ok){if(!isDone(it.id)){setDone(it.id,true);fs.known++;}}
  else{if(isDone(it.id))setDone(it.id,false);fs.deck.splice(Math.min(fs.deck.length,3+Math.floor(Math.random()*3)),0,it);fs.total++;}
  fs.flipped=false;fs.spoke=false;renderFlash();
}
document.addEventListener("keydown",e=>{
  if(ui.mode!=="flash"||!fs||e.target.tagName==="INPUT")return;
  if(e.key===" "){e.preventDefault();const c=$("#card");if(c)c.click();}
  else if(e.key==="ArrowRight"&&$("#yes"))flashAnswer(true);
  else if(e.key==="ArrowLeft"&&$("#no"))flashAnswer(false);
});

/* ---------- 测验 ---------- */
let qs=null;
function newQuiz(){
  const pool=scopeItems();
  const todo=shuffle(pool.filter(x=>!isDone(x.id))),done=shuffle(pool.filter(x=>isDone(x.id)));
  const qsItems=todo.concat(done).slice(0,Math.min(10,pool.length));
  qs={list:shuffle(qsItems),i:0,score:0,missed:[],answered:null};
  qs.list.forEach(it=>{
    const same=shuffle(pool.filter(x=>x!==it&&x.zh!==it.zh));
    const others=same.length>=3?same:same.concat(shuffle(ALL.filter(x=>x!==it&&!same.includes(x)&&x.zh!==it.zh)));
    it._choices=shuffle([it].concat(others.slice(0,3)));
  });
}
function renderQuiz(){
  if(!qs)newQuiz();
  const m=$("#main");
  const opts='<div class="opts">'+(canSpeak?'<div class="seg"><button id="qa" aria-pressed="'+ui.quizAudio+'">听音选义（隐藏单词）</button></div>':"")+"</div>";
  if(qs.i>=qs.list.length){
    m.innerHTML=chHead()+'<div class="stage"><div class="result"><div class="exzh">本轮得分</div><div class="score">'+qs.score+" / "+qs.list.length+'</div><div class="exzh">'+(qs.missed.length?"答错的词已标为「没记住」，会优先出现在闪卡里。":"全对，这一组可以放心了。")+"</div>"+
      (qs.missed.length?'<div class="missed">'+qs.missed.map(it=>'<div><span class="word">'+esc(it.w)+'</span> <span class="ipa">'+esc(it.ipa)+'</span><div>'+esc(it.zh)+"</div></div>").join("")+"</div>":"")+
      '</div><button class="btn primary" id="again">再测一轮</button></div>';
    $("#again").onclick=()=>{newQuiz();renderQuiz();};return;
  }
  const it=qs.list[qs.i];const hide=ui.quizAudio&&canSpeak&&qs.answered==null;
  m.innerHTML=chHead()+'<div class="stage">'+opts+'<div class="q"><span class="count">第 '+(qs.i+1)+" / "+qs.list.length+" 题 · 得分 "+qs.score+"</span>"+
    (hide?'<button class="btn primary" id="qplay" style="width:auto;padding:12px 22px">播放发音</button>':'<div class="big word" style="font-size:30px">'+esc(it.w)+'</div><div class="ipa">'+esc(it.ipa)+"</div>")+
    (canSpeak&&!hide?'<button class="say" id="qplay" aria-label="播放发音">'+ICON+"</button>":"")+
    "</div>"+'<div class="choices">'+it._choices.map((c,k)=>{let cls="choice";if(qs.answered!=null){if(c===it)cls+=" right";else if(k===qs.answered)cls+=" wrong";}return '<button class="'+cls+'" data-k="'+k+'"'+(qs.answered!=null?" disabled":"")+">"+esc(c.zh)+"</button>";}).join("")+"</div>"+
    (qs.answered!=null?'<div class="feedback"><div><span class="word" style="font-size:18px">'+esc(it.w)+'</span> <span class="ipa">'+esc(it.ipa)+'</span></div><div class="ex"><span>'+highlight(it.ex,it.w)+'</span></div><div class="exzh">'+esc(it.exZh)+'</div></div><button class="btn primary" id="qnext">'+(qs.i+1<qs.list.length?"下一题":"看结果")+"</button>":"")+
    "</div>";
  const qa=$("#qa");if(qa)qa.onclick=()=>{ui.quizAudio=!ui.quizAudio;saveUI();renderQuiz();if(ui.quizAudio&&qs.answered==null)sayWord(it);};
  const qp=$("#qplay");if(qp)qp.onclick=()=>sayWord(it);
  document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    if(qs.answered!=null)return;const k=+b.dataset.k;qs.answered=k;
    if(it._choices[k]===it)qs.score++;else{qs.missed.push(it);if(isDone(it.id))setDone(it.id,false);}
    renderQuiz();sayWord(it);
  });
  const nx=$("#qnext");if(nx)nx.onclick=()=>{qs.i++;qs.answered=null;renderQuiz();const n=qs.list[qs.i];if(n&&ui.quizAudio)sayWord(n);};
  if(hide&&!qs.spoke){qs.spoke=qs.i+1;}
}

function resetSessions(){fs=null;qs=null;}
function renderMain(){if(ui.mode==="flash")renderFlash();else if(ui.mode==="quiz")renderQuiz();else renderList();}
function renderAll(){renderToday();renderMeter();renderRail();renderTabs();renderMain();}

/* 默认打开今天所在的场景 */
if(!ui.ch||(ui.ch!=="all"&&!CHAPTERS.find(c=>c.id===ui.ch))){
  const tc=CHAPTERS.find(c=>c.range&&isToday(c));ui.ch=tc?tc.id:"air";
}
renderAll();
const active=document.querySelector('.chip[aria-pressed="true"]');if(active)active.scrollIntoView({block:"nearest",inline:"center"});
setTimeout(initRemote,0);
})();
</script>
